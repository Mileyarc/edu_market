# MySQL Database Configuration
# Make sure MySQL is running and database 'edumarket' exists
# To create database, run in MySQL: CREATE DATABASE edumarket;
spring.datasource.url=jdbc:mysql://localhost:3306/edumarket?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=261299
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

/# Thymeleaf Configur//ation
spring.thymeleaf.cache=false

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB