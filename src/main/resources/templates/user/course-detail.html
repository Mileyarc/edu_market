<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${course.title}">Course Detail</title>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="alert alert-info mb-4">
            <strong>Liên hệ Edumarket:</strong><br>
            Địa chỉ email: <a href="mailto:mileytrang.edu@gmail.com">mileytrang.edu@gmail.com</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

        <div class="row">
            <div class="col-md-4" th:if="${course.image != null && !course.image.isEmpty()}">
                <img th:src="@{${course.image}}" alt="Course image" class="img-fluid rounded">
            </div>
            <div class="col-md-8">
                <h2 th:text="${course.title}"></h2>
                
                <div class="mb-3">
                    <strong>Description:</strong>
                    <p th:text="${course.description}"></p>
                </div>
                
                <div class="mb-3">
                    <strong>Tuition Fee:</strong> $<span th:text="${course.price}"></span>
                </div>

                <div class="mb-3">
                    <strong>Teacher:</strong> <span th:text="${course.instructor}"></span>
                </div>

                <div class="mb-3">
                    <strong>Category:</strong> <span th:text="${course.category != null ? course.category.name : 'N/A'}"></span>
                </div>

                <div class="mb-3">
                    <form th:if="${#authentication.isAuthenticated()}" 
                          th:action="@{/enroll}" 
                          method="post" 
                          style="display: inline;">
                        <input type="hidden" name="courseId" th:value="${course.id}">
                        <button type="submit" class="btn btn-primary btn-lg">Enroll</button>
                    </form>
                    <div th:if="${!#authentication.isAuthenticated()}">
                        <a th:href="@{/login}" class="btn btn-primary btn-lg">Login to Enroll</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="/courses" class="btn btn-secondary">Back to Courses</a>
        </div>
    </div>
</body>
</html>
