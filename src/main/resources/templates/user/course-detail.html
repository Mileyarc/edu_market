<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${course.title}">Course Detail</title>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="alert alert-info mb-4">
            <strong>Liên hệ Edumarket:</strong><br>
            Địa chỉ email: <a href="mailto:mileytrang.edu@gmail.com">mileytrang.edu@gmail.com</a>
        </div>
        <h2 th:text="${course.title}"></h2>
        
        <div class="mb-3">
            <strong>Description:</strong> <span th:text="${course.description}"></span>
        </div>
        
        <div class="mb-3">
            <strong>Price:</strong> <span th:text="${course.price}"></span>
        </div>

        <div class="mb-3">
            <strong>Instructor:</strong> <span th:text="${course.instructor}"></span>
        </div>

        <div class="mb-3">
            <strong>Category:</strong> <span th:text="${course.category != null ? course.category.name : 'N/A'}"></span>
        </div>

        <a href="/courses" class="btn btn-secondary">Back to Courses</a>
    </div>
</body>
</html>
