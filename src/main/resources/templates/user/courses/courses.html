<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<!-- Contact info -->
<div class="alert alert-info mb-4 text-center">
    <strong>Liên hệ Edumarket:</strong><br>
    Email:
    <a href="mailto:mileytrang.edu@gmail.com">mileytrang.edu@gmail.com</a>
</div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>


    <h2 class="mb-4">Available Courses</h2>

    <!-- Search -->
    <form class="row g-3 mb-4" method="get" th:action="@{/user/courses}">
        <div class="col-auto">
            <input type="text"
                   class="form-control"
                   name="search"
                   placeholder="Search by title"
                   th:value="${search}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-danger">Search</button>
        </div>
    </form>

    <!-- Course list -->
    <div class="row" th:if="${courses != null}">

        <div class="col-md-4 mb-4" th:each="course : ${courses}">
            <div class="card h-100">

                <!-- Course image -->
                <img th:if="${course.image != null}"
                     th:src="${course.image}"
                     class="card-img-top"
                     style="height:200px; object-fit:cover;"
                     alt="Course image">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${course.title}">
                        Course title
                    </h5>

                    <p class="card-text"
                       th:text="${#strings.abbreviate(course.description, 100)}">
                        Description
                    </p>

                    <p class="card-text">
                        <strong>Price:</strong>
                        $<span th:text="${course.price}">0</span>
                    </p>

                    <p class="card-text">
                        <strong>Category:</strong>
                        <span th:text="${course.category != null ? course.category.name : 'N/A'}">
                            Category
                        </span>
                    </p>

                    <div class="mt-auto">
                        <a th:href="@{/courses/{id}(id=${course.id})}"
                           class="btn btn-primary btn-sm">
                            View Details
                        </a>

                        <a th:href="@{/login}"
                           class="btn btn-success btn-sm ms-2">
                            Enroll
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages != null and totalPages > 1}">
        <ul class="pagination justify-content-center mt-4">

            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/user/courses(page=${currentPage - 1}, size=6, search=${search})}">
                    Previous
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/user/courses(page=${i}, size=6, search=${search})}"
                   th:text="${i + 1}">
                </a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/user/courses(page=${currentPage + 1}, size=6, search=${search})}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

</div>

</body>
</html>
