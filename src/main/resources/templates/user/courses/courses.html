<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="alert alert-info mb-4">
        <strong>Liên hệ Edumarket:</strong><br>
        Địa chỉ email: <a href="mailto:mileytrang.edu@gmail.com">mileytrang.edu@gmail.com</a>
    </div>
    <div class="container mt-4">
        <h2>Available Courses</h2>
        
        <!-- Search Form -->
        <form class="row g-3 mb-4" method="get" th:action="@{/user/courses}">
            <div class="col-auto">
                <input type="text" class="form-control" name="search" placeholder="Search by title" th:value="${search}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-danger mb-3">Search</button>
            </div>
        </form>
        
        <div class="row mt-4">
            <div class="col-md-4 mb-4" th:each="course : ${courses}">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${course.title}">Course Title</h5>
                        <p class="card-text" th:text="${course.description}">Course Description</p>
                        <p class="card-text"><strong>Price: $</strong><span th:text="${course.price}">0.01</span></p>
                        <p class="card-text"><strong>Category: </strong><span th:text="${course.category != null ? course.category.name : ''}">Category</span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center mt-4">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${currentPage - 1}, size=6, search=${search})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/courses(page=${i}, size=6, search=${search})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${currentPage + 1}, size=6, search=${search})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
