<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${formTitle}">Course Form</title>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 th:text="${formTitle}"></h2>

        <form th:action="@{${actionUrl}}" th:object="${course}" method="post" class="mt-4">
            
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" required></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" class="form-control" id="price" th:field="*{price}" step="0.01" required>
                <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="mb-3">
                <label for="instructor" class="form-label">Instructor</label>
                <input type="text" class="form-control" id="instructor" th:field="*{instructor}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}"></div>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <div class="input-group">
                    <select class="form-select" id="categorySelect" name="categoryId">
                        <option value="">-- Select category --</option>
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.id}" 
                                th:text="${cat.name}"
                                th:selected="${course.category != null} ? ${cat.id} == ${course.category.id} : false">
                        </option>
                        <option value="add_new"
                                th:selected="${course.category == null}">-- Add new --</option>
                    </select>
                    <input type="text" class="form-control" id="newCategoryInput" name="newCategory"
                           placeholder="New category"
                           th:value="${param.newCategory}"
                           style="display: none;">
                </div>
                <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
            
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    const select = document.getElementById('categorySelect');
                    const input = document.getElementById('newCategoryInput');
            
                    function toggleInput() {
                        if (select.value === 'add_new') {
                            input.style.display = 'block';
                        } else {
                            input.style.display = 'none';
                            input.value = '';
                        }
                    }
            
                    select.addEventListener('change', toggleInput);
            
                    // Gọi khi load lại trang (ví dụ lỗi validation)
                    toggleInput();
                });
            </script>
            
            <div class="mb-3">
                <label for="note" class="form-label">Note</label>
                <input type="text" class="form-control" id="note" th:field="*{note}">
            </div>
            
            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/courses}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
