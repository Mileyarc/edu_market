    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Course Management</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2>Course Management</h2>
            
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>

            <a href="/admin/courses/create" class="btn btn-primary mb-3">Create New Course</a>

            <!-- Search Form -->
            <form class="row g-3 mb-4" method="get" action="" th:action="@{/admin/courses}">
                <div class="col-auto">
                    <input type="text" class="form-control" name="search" placeholder="Search by title" th:value="${search}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary mb-3">Search</button>
                </div>
            </form>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>CourseID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Instructor</th>
                        <th>Category</th>
                        <th>Note</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.id}"></td>
                        <td th:text="${course.title}"></td>
                        <td th:text="${course.description}"></td>
                        <td th:text="${course.price}"></td>
                        <td th:text="${course.instructor}"></td>
                        <td th:text="${course.category != null ? course.category.name : ''}"></td>
                        <td th:text="${course.note}"></td>
                        <td>
                            <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/admin/courses/{id}/enrollers(id=${course.id})}" class="btn btn-sm btn-info">Enrollers</a>
                            <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}" 
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this course?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mt-4">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/courses(page=${currentPage - 1}, size=10, search=${search})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/courses(page=${i}, size=10, search=${search})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/courses(page=${currentPage + 1}, size=10, search=${search})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </body>
    </html>
