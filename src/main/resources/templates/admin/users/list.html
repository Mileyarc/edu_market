<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>User Management</h2>
        
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Search Form -->
        <form class="row g-3 mb-4" method="get" th:action="@{/admin/users}">
            <div class="col-auto">
                <input type="text" class="form-control" name="search" placeholder="Search by email or name" th:value="${search}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary mb-3">Search</button>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Full Name</th>
                    <th>Age</th>
                    <th>Phone Number</th>
                    <th>Status</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.age}"></td>
                    <td th:text="${user.phoneNumber}"></td>
                    <td>
                        <span th:if="${user.active}" class="badge bg-success">Active</span>
                        <span th:if="${!user.active}" class="badge bg-danger">Inactive</span>
                    </td>
                    <td th:text="${user.role}"></td>
                    <td>
                        <form th:if="${user.active}" 
                              th:action="@{/admin/users/{id}/deactivate(id=${user.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-warning">Deactivate</button>
                        </form>
                        <form th:if="${!user.active}" 
                              th:action="@{/admin/users/{id}/activate(id=${user.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-success">Activate</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center mt-4">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, size=10, search=${search})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${i}, size=10, search=${search})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, size=10, search=${search})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
