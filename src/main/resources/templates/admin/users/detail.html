<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>User Details</h2>
        
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${user}" class="card">
            <div class="card-body">
                <h5 class="card-title">User Information</h5>
                <table class="table table-bordered">
                    <tr>
                        <th>ID</th>
                        <td th:text="${user.id}"></td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <td th:text="${user.email}"></td>
                    </tr>
                    <tr>
                        <th>Full Name</th>
                        <td th:text="${user.fullName}"></td>
                    </tr>
                    <tr>
                        <th>Age</th>
                        <td th:text="${user.age}"></td>
                    </tr>
                    <tr>
                        <th>Phone Number</th>
                        <td th:text="${user.phoneNumber}"></td>
                    </tr>
                    <tr>
                        <th>Role</th>
                        <td th:text="${user.role}"></td>
                    </tr>
                    <tr>
                        <th>Status</th>
                        <td>
                            <span th:if="${user.active}" class="badge bg-success">Active</span>
                            <span th:if="${!user.active}" class="badge bg-danger">Inactive</span>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/admin/users}" class="btn btn-secondary">Back to User List</a>
        </div>
    </div>
</body>
</html>
